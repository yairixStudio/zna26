<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZNA 2026 — Lineup guide</title>
  <meta name="description" content="The unofficial fan guide to ZNA Gathering 2026 lineup — TikTok-style scroll through every artist" />
  <meta name="theme-color" content="#0a0524" />
  <meta name="color-scheme" content="dark" />
  <!-- iOS Add-to-Home-Screen treats the app as a standalone PWA, hiding
       the Safari chrome. Modern browsers also read the W3C manifest below. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ZNA 2026" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Critical above-the-fold styles inlined so the first paint never waits
       on styles.css. Everything else streams via the <link> below.
       Includes a body[data-css-loading] hide rule so the unstyled DOM
       (reel sections / hero panels) never paints before styles.css lands —
       fixes the half-second of "compressed elements" flash on refresh. -->
  <style>
    html,body{height:100%;margin:0;padding:0;background:#0a0524;color:#f5f0ff;
      font-family:"Heebo","Segoe UI","Assistant",system-ui,sans-serif;
      -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
      overflow:hidden;overscroll-behavior:none}
    body{direction:ltr}
    .reel{position:absolute;inset:0;height:100dvh;width:100%;overflow-y:scroll;
      overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-snap-type:y mandatory;
      overscroll-behavior-y:contain;touch-action:pan-y;scrollbar-width:none}
    .reel::-webkit-scrollbar{display:none}
    .bg-scene{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 0,rgba(255,126,31,.18) 0,transparent 60%),linear-gradient(180deg,#0a0524 0,#1a0a3a 100%)}
    .top-bar{position:fixed;top:0;left:0;right:0;z-index:30;
      padding:max(12px,env(safe-area-inset-top)) 14px 8px;display:flex;
      align-items:center;justify-content:space-between;pointer-events:none}
    .top-bar > *{pointer-events:auto}
    .vertical-progress{position:fixed;right:8px;top:50%;transform:translateY(-50%);
      z-index:20;display:flex;flex-direction:column;gap:6px;opacity:0;transition:opacity .25s}
    /* Hide unstyled content until styles.css loads — JS removes the flag. */
    body[data-css-loading="1"] .reel,
    body[data-css-loading="1"] .top-bar,
    body[data-css-loading="1"] .mini-player{visibility:hidden}
  </style>

  <!-- Preconnect once to the gstatic font CDN; googleapis is the discovery
       redirect, so a single warm-up suffices. font-display:swap on the CSS
       below means the system fallback paints immediately while the
       webfonts hydrate in the background. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&family=Orbitron:wght@800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&family=Orbitron:wght@800&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&family=Orbitron:wght@800&display=swap" /></noscript>

  <!-- Main stylesheet — render-blocking so the first paint isn't unstyled
       (was preload+onload-swap, but that caused a ~500ms FOUC on cold
       loads). styles.css is ~85KB raw / ~20KB gzipped — fine to block. -->
  <link rel="stylesheet" href="styles.css" onload="document.body && document.body.removeAttribute('data-css-loading');" />
  <noscript><link rel="stylesheet" href="styles.css" /></noscript>

  <!-- Preconnect to YouTube origins so the first Play (or thumbnail) doesn't
       eat the TLS handshake cost. dns-prefetch kept as a fallback. -->
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
  <link rel="preconnect" href="https://www.youtube.com" crossorigin />
  <link rel="dns-prefetch" href="https://www.youtube.com" />
  <link rel="dns-prefetch" href="https://i.ytimg.com" />
  <link rel="dns-prefetch" href="https://s.ytimg.com" />
  <link rel="dns-prefetch" href="https://i9.ytimg.com" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23FEB447'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23ff5c8a'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png" />
</head>
<body data-css-loading="1">
  <script>
    // Belt-and-braces: even if the stylesheet's onload doesn't fire (e.g.
    // when it's already cached and onload is suppressed by some browsers),
    // clear the flag once DOM is parsed so we never permanently hide the UI.
    document.addEventListener("DOMContentLoaded", function () {
      requestAnimationFrame(function () {
        document.body && document.body.removeAttribute("data-css-loading");
      });
    });
  </script>
  <div class="bg-scene" id="bg-scene"></div>
  <div class="stars"></div>
  <div class="bg-grid"></div>

  <main class="reel" id="reel" aria-label="Festival lineup reel"></main>

  <!-- Floating mini-player -->
  <div class="mini-player" id="mini-player" aria-hidden="true">
    <div class="mini-player-frame" id="mini-player-frame"></div>
    <div class="mini-player-info">
      <div class="mini-player-title" id="mini-player-title"></div>
      <div class="mini-player-artist" id="mini-player-artist"></div>
      <div class="mini-player-next" id="mini-player-next"></div>
    </div>
    <div class="mini-player-controls">
      <button class="mini-player-btn" id="mini-player-close" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6.4 5L5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
      </button>
      <button class="mini-player-btn" id="mini-player-expand" title="Expand / collapse" aria-label="Expand or collapse">
        <svg class="icon-when-collapsed" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 8l-7 7 1.4 1.4L12 10.8l5.6 5.6L19 15z"/></svg>
        <svg class="icon-when-expanded" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 16l7-7-1.4-1.4L12 13.2 6.4 7.6 5 9z"/></svg>
      </button>
      <button class="mini-player-btn" id="mini-player-skip" title="Next track" aria-label="Next track">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6l8 6-8 6V6zm10 0h2v12h-2z"/></svg>
      </button>
    </div>
  </div>

  <!-- Top bar: search left · ZNA brand center · stage dropdown right -->
  <div class="top-bar" aria-label="Navigation">
    <div class="top-bar-side top-bar-left">
      <button class="round-btn glass-btn" id="search-btn" title="Search artist" aria-label="Search artist">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
      <button class="round-btn glass-btn" id="random-btn" title="קפיצה לאומן אקראי" aria-label="קפיצה לאומן אקראי">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
    </div>

    <div class="top-bar-side top-bar-center">
      <button class="round-btn glass-btn" id="logo-btn" title="Back to home" aria-label="Back to home">
        <span class="logo-mini">ZNA</span>
      </button>
    </div>

    <div class="top-bar-side top-bar-right">
      <div class="stage-select" id="stage-select" aria-label="Select stage">
        <button class="stage-select-trigger glass-btn" id="stage-select-trigger" aria-haspopup="listbox" aria-expanded="false">
          <span id="stage-select-label">All</span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <ul class="stage-select-menu glass-card" id="stage-select-menu" role="listbox" hidden></ul>
      </div>
    </div>
  </div>

  <!-- Search overlay -->
  <div class="search-overlay" id="search-overlay" hidden>
    <div class="search-panel glass-card" role="dialog" aria-label="Search artist">
      <input type="text" id="search-input" class="search-input" placeholder="Search artist…" autocomplete="off" />
      <div class="search-results" id="search-results"></div>
    </div>
  </div>

  <!-- UI overlays -->
  <div class="vertical-progress" id="vertical-progress" aria-hidden="true"></div>

  <!-- Floating tooltip used by the vertical dots on desktop hover.
       Lives outside .vertical-progress so the container's max-height/overflow
       can't clip it. JS positions it next to the hovered dot. -->
  <div class="v-dot-tooltip" id="v-dot-tooltip" role="tooltip" aria-hidden="true"></div>

  <!-- defer = parsed in document order, executed after HTML parsing finishes,
       so they don't block the first paint. data.js MUST load before
       official-artists.js (which mutates ARTISTS) and both before app.js. -->
  <script defer src="data.js"></script>
  <script defer src="official-artists.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
