<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZNA 2026 — מדריך הליין-אפ</title>
  <meta name="description" content="המדריך הבלתי רשמי לאומני פסטיבל ZNA Gathering 2026 — גלגל בין אומנים כמו ב-TikTok" />
  <meta name="theme-color" content="#0a0524" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23FEB447'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23ff5c8a'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="bg-scene" id="bg-scene"></div>
  <div class="stars"></div>
  <div class="bg-grid"></div>

  <main class="reel" id="reel" aria-label="Festival lineup reel"></main>

  <!-- Floating mini-player -->
  <div class="mini-player" id="mini-player" aria-hidden="true">
    <div class="mini-player-frame" id="mini-player-frame"></div>
    <div class="mini-player-info">
      <div class="mini-player-title" id="mini-player-title"></div>
      <div class="mini-player-artist" id="mini-player-artist"></div>
      <div class="mini-player-next" id="mini-player-next"></div>
    </div>
    <div class="mini-player-controls">
      <button class="mini-player-btn" id="mini-player-skip" title="הבא" aria-label="הטראק הבא">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6l8 6-8 6V6zm10 0h2v12h-2z"/></svg>
      </button>
      <button class="mini-player-btn" id="mini-player-expand" title="הרחב/כווץ" aria-label="הרחב או כווץ">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M5 5h6v2H7v4H5V5zm14 0v6h-2V7h-4V5h6zM5 19v-6h2v4h4v2H5zm14 0h-6v-2h4v-4h2v6z"/></svg>
      </button>
      <button class="mini-player-btn" id="mini-player-close" title="סגור" aria-label="סגור">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6.4 5L5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
      </button>
    </div>
  </div>

  <!-- Top bar: stage dropdown (left) + logo + search (right) -->
  <div class="top-bar" aria-label="ניווט עליון">
    <div class="stage-select" id="stage-select" aria-label="בחירת במה">
      <button class="stage-select-trigger glass-btn" id="stage-select-trigger" aria-haspopup="listbox" aria-expanded="false">
        <span id="stage-select-label">הכל</span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
      <ul class="stage-select-menu glass-card" id="stage-select-menu" role="listbox" hidden></ul>
    </div>

    <div class="top-bar-actions">
      <button class="round-btn glass-btn" id="logo-btn" title="חזרה לדף הראשי" aria-label="חזרה לדף הראשי">
        <span class="logo-mini">ZNA</span>
      </button>
      <button class="round-btn glass-btn" id="search-btn" title="חיפוש אומן" aria-label="חיפוש אומן">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
  </div>

  <!-- Search overlay -->
  <div class="search-overlay" id="search-overlay" hidden>
    <div class="search-panel glass-card" role="dialog" aria-label="חיפוש אומן">
      <input type="text" id="search-input" class="search-input" placeholder="חפש אומן..." autocomplete="off" />
      <div class="search-results" id="search-results"></div>
    </div>
  </div>

  <!-- UI overlays -->
  <div class="vertical-progress" id="vertical-progress" aria-hidden="true"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
